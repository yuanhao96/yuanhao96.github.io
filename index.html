<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuanhao Huang</title>
<meta name="description" content="Yuanhao Huang — resume and CV.">
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #1c1c1c;
    --muted: #666;
    --accent: #1f4e8c;
    --rule: #e2dfda;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --fg: #e8e6e3;
      --muted: #9a9a9a;
      --accent: #8ab4f8;
      --rule: #2e2e2e;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
      "PingFang SC", "Noto Sans CJK SC", sans-serif;
  }
  main { max-width: 36rem; margin: 0 auto; padding: 4rem 16px; }
  h1 { font-size: 2rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  .tagline { color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
  li { border-bottom: 1px solid var(--rule); }
  li a {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: 0.9rem 0; color: var(--fg); text-decoration: none;
  }
  li a:hover .name { color: var(--accent); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.9rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Yuanhao Huang</h1>
  <p class="tagline">Research scientist · ads ranking · biomedical AI</p>
  <ul>
    <li><a href="resume.pdf">
      <span class="name">Resume</span><span class="meta">English · 2 pages · PDF</span>
    </a></li>
    <li><a href="cv.pdf">
      <span class="name">Full CV</span><span class="meta">English · PDF</span>
    </a></li>
    <li><a href="resume-cn.pdf">
      <span class="name">中文简历</span><span class="meta">Chinese · PDF</span>
    </a></li>
  </ul>
  <footer>
    <a href="https://github.com/yuanhao96">github.com/yuanhao96</a>
  </footer>
</main>
</body>
</html>
